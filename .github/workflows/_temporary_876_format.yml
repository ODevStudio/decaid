name: Temporary #876 Dart format

on:
  push:
    branches:
      - fix/876-ble-recovery-integration
    paths:
      - .github/workflows/_temporary_876_format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/876-ble-recovery-integration
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format #876 Dart files
        run: |
          dart format \
            lib/src/controllers/connection/connection_attempt_owner.dart \
            test/controllers/connection_attempt_owner_test.dart \
            test/controllers/de1_controller_test.dart \
            test/unit/controllers/scale_connection_generation_test.dart
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/_temporary_876_format.yml
          git config user.name ODevStudio
          git config user.email ODevStudio@proton.me
          git add -A
          git diff --cached --check
          git commit -m 'style: format #876 connection tests'
          git push origin HEAD:fix/876-ble-recovery-integration
