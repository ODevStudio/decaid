name: Temporary PR 881 review fixes

on:
  push:
    branches:
      - fix/876-ble-recovery-integration
    paths:
      - .github/workflows/_temporary_881_review_fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/876-ble-recovery-integration
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply review fixes
        run: python3 .github/_temporary_881_review_fixes.py
      - name: Refine expected-disconnect regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/controllers/connection_manager_test.dart')
          text = p.read_text()
          old_assertion = "        expect(\n          connectionManager.currentStatus.error?.kind,\n          ConnectionErrorKind.bluetoothPermissionDenied,\n        );\n        connectionManager.debugNotifyMachineDisconnected(device.deviceId);\n        expect(\n          connectionManager.currentStatus.error?.kind,\n          ConnectionErrorKind.bluetoothPermissionDenied,\n        );\n"
          new_assertion = "        final errorBeforeDisconnect = connectionManager.currentStatus.error;\n        connectionManager.debugNotifyMachineDisconnected(device.deviceId);\n        expect(connectionManager.currentStatus.error, same(errorBeforeDisconnect));\n"
          if old_assertion not in text:
              raise SystemExit('expected-disconnect assertion anchor not found')
          text = text.replace(old_assertion, new_assertion, 1)
          old_sync = "        mockScanner.quickConnectResult = device;\n        connectionManager = ConnectionManager(\n          deviceScanner: mockScanner,\n          de1Controller: mockDe1Controller,\n          scaleController: mockScaleController,\n          settingsController: settingsController,\n          rememberedDevices: remembered,\n        );\n\n        final connecting = connectionManager.connect();\n        await Future<void>.delayed(Duration.zero);\n        mockScanner.mockAdapterState(AdapterState.unauthorized);\n        await Future<void>.delayed(Duration.zero);\n        mockDe1Controller.de1Subject.add(device);\n"
          new_sync = "        mockScanner.mockAdapterState(AdapterState.poweredOn);\n        final adoptionController = _AdoptionObservingMockDe1Controller(\n          controller: DeviceController([dummyDiscoveryService]),\n        );\n        mockScanner.quickConnectResult = device;\n        connectionManager = ConnectionManager(\n          deviceScanner: mockScanner,\n          de1Controller: adoptionController,\n          scaleController: mockScaleController,\n          settingsController: settingsController,\n          rememberedDevices: remembered,\n        );\n\n        final connecting = connectionManager.connect();\n        await adoptionController.adopted.future;\n        mockScanner.mockAdapterState(AdapterState.unauthorized);\n        await Future<void>.delayed(Duration.zero);\n        adoptionController.de1Subject.add(device);\n"
          if old_sync not in text:
              raise SystemExit('quick-connect adoption synchronization anchor not found')
          text = text.replace(old_sync, new_sync, 1)
          helper = "\nclass _AdoptionObservingMockDe1Controller extends MockDe1Controller {\n  final Completer<De1Interface> adopted = Completer<De1Interface>();\n\n  _AdoptionObservingMockDe1Controller({required super.controller});\n\n  @override\n  void adoptDevice(De1Interface device) {\n    if (!adopted.isCompleted) adopted.complete(device);\n  }\n}\n"
          if 'class _AdoptionObservingMockDe1Controller' in text:
              raise SystemExit('adoption observer helper already exists')
          p.write_text(text + helper)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/models/device/transport/ble_connect_exception.dart \
            lib/src/controllers/connection/connection_attempt_owner.dart \
            lib/src/services/universal_ble_discovery_service.dart \
            lib/src/controllers/connection_manager.dart \
            test/helpers/mock_device_scanner.dart \
            test/controllers/connection_attempt_owner_test.dart \
            test/services/universal_ble_discovery_service_test.dart \
            test/controllers/connection_manager_test.dart
      - name: Run focused tests
        run: |
          flutter test --no-pub test/controllers/connection_attempt_owner_test.dart
          flutter test --no-pub test/services/universal_ble_discovery_service_test.dart --plain-name 'quick-connect does not retry recovery-blocked admission'
          flutter test --no-pub test/controllers/connection_manager_test.dart
      - name: Commit fixes and remove temporary files
        run: |
          rm .github/workflows/_temporary_881_review_fixes.yml
          rm .github/_temporary_881_review_fixes.py
          git config user.name ODevStudio
          git config user.email ODevStudio@proton.me
          git add -A
          git diff --cached --check
          git commit -m 'fix(ble): retain recovery-blocked connection ownership'
          git push origin HEAD:fix/876-ble-recovery-integration
