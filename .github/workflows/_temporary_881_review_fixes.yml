name: Temporary PR 881 review fixes

on:
  push:
    branches:
      - fix/876-ble-recovery-integration
    paths:
      - .github/workflows/_temporary_881_review_fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/876-ble-recovery-integration
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # Expose a stable semantic discriminator for the native recovery barrier.
          replace(
              'lib/src/models/device/transport/ble_connect_exception.dart',
              "  BleConnectException({this.code, this.description, this.function, this.cause});\n\n  @override\n",
              "  BleConnectException({this.code, this.description, this.function, this.cause});\n\n  bool get recoveryBlocked =>\n      description?.startsWith('RECOVERY_BLOCKED:') ?? false;\n\n  @override\n",
          )

          # Let callers inspect the exact retained lease without duplicating normalization.
          replace(
              'lib/src/controllers/connection/connection_attempt_owner.dart',
              "  bool owns(String deviceId, {ConnectionAttemptRole? role}) {\n",
              "  ConnectionAttemptLease? activeFor(String deviceId) =>\n      _active[_normalize(deviceId)];\n\n  bool owns(String deviceId, {ConnectionAttemptRole? role}) {\n",
          )

          # RECOVERY_BLOCKED is not a physical connect failure: do not consume the host retry.
          replace(
              'lib/src/services/universal_ble_discovery_service.dart',
              "    } on BleConnectException catch (e) {\n      log.info('Quick-connect GATT error ($e), retrying once after 1s');\n",
              "    } on BleConnectException catch (e) {\n      if (e.recoveryBlocked) rethrow;\n      log.info('Quick-connect GATT error ($e), retrying once after 1s');\n",
          )
          replace(
              'lib/src/services/universal_ble_discovery_service.dart',
              "    } catch (e, st) {\n      log.warning('Quick-connect failed for $deviceId', e, st);\n      try {\n        await device.disconnect();\n      } catch (_) {}\n      try {\n        await transport.dispose();\n      } catch (_) {}\n      return null;\n    }\n  }\n\n  Future<BleDevice?> _findSystemDevice",
              "    } on BleConnectException catch (e, st) {\n      if (e.recoveryBlocked) {\n        log.warning('Quick-connect recovery blocked for $deviceId', e, st);\n        try {\n          await transport.dispose();\n        } catch (_) {}\n        rethrow;\n      }\n      log.warning('Quick-connect failed for $deviceId', e, st);\n      try {\n        await device.disconnect();\n      } catch (_) {}\n      try {\n        await transport.dispose();\n      } catch (_) {}\n      return null;\n    } catch (e, st) {\n      log.warning('Quick-connect failed for $deviceId', e, st);\n      try {\n        await device.disconnect();\n      } catch (_) {}\n      try {\n        await transport.dispose();\n      } catch (_) {}\n      return null;\n    }\n  }\n\n  Future<BleDevice?> _findSystemDevice",
          )

          # Retain any BLE lease whose source reports the native recovery barrier.
          replace(
              'lib/src/controllers/connection_manager.dart',
              "  Future<bool> _retireAttempt(\n    ConnectionAttemptLease attempt,\n    Future<void> source,\n    bool Function() adopted,\n    Future<void> Function() cleanup,\n  ) async {\n    final adapterResetEpoch = _adapterResetEpoch;\n    Object? sourceError;\n    StackTrace? sourceStack;\n    try {\n      await source;\n    } catch (error, stackTrace) {\n      sourceError = error;\n      sourceStack = stackTrace;\n    }\n    var cleanupSucceeded = true;\n    try {\n      final mayAdopt = attempt.mayAdopt;\n      if (!mayAdopt || sourceError != null || !adopted()) {\n        try {\n          await cleanup();\n        } catch (error, stackTrace) {\n          cleanupSucceeded = false;\n          if (attempt.ble && adapterResetEpoch != _adapterResetEpoch) {\n            attempt.settle();\n          } else {\n            attempt.markCleanupFailed();\n          }\n          _log.warning(\n            'Connection attempt cleanup failed for ${attempt.deviceId}',\n            error,\n            stackTrace,\n          );\n          Error.throwWithStackTrace(error, stackTrace);\n        }\n        if (mayAdopt && sourceError != null) {\n          Error.throwWithStackTrace(sourceError, sourceStack!);\n        }\n        return false;\n      }\n      return true;\n    } finally {\n      if (cleanupSucceeded) attempt.settle();\n    }\n  }\n",
              "  Future<bool> _retireAttempt(\n    ConnectionAttemptLease attempt,\n    Future<void> source,\n    bool Function() adopted,\n    Future<void> Function() cleanup,\n  ) async {\n    final adapterResetEpoch = _adapterResetEpoch;\n    Object? sourceError;\n    StackTrace? sourceStack;\n    try {\n      await source;\n    } catch (error, stackTrace) {\n      sourceError = error;\n      sourceStack = stackTrace;\n    }\n    final recoveryBlocked =\n        attempt.ble &&\n        sourceError is BleConnectException &&\n        sourceError.recoveryBlocked;\n    var cleanupSucceeded = true;\n    try {\n      final mayAdopt = attempt.mayAdopt;\n      if (!mayAdopt || sourceError != null || !adopted()) {\n        try {\n          await cleanup();\n        } catch (error, stackTrace) {\n          cleanupSucceeded = false;\n          if (attempt.ble && adapterResetEpoch != _adapterResetEpoch) {\n            attempt.settle();\n          } else {\n            attempt.markCleanupFailed();\n          }\n          _log.warning(\n            'Connection attempt cleanup failed for ${attempt.deviceId}',\n            error,\n            stackTrace,\n          );\n          Error.throwWithStackTrace(error, stackTrace);\n        }\n        if (recoveryBlocked && adapterResetEpoch == _adapterResetEpoch) {\n          attempt.markCleanupFailed();\n        }\n        if (mayAdopt && sourceError != null) {\n          Error.throwWithStackTrace(sourceError, sourceStack!);\n        }\n        return false;\n      }\n      return true;\n    } finally {\n      if (cleanupSucceeded && !attempt.cleanupFailed) attempt.settle();\n    }\n  }\n",
          )

          # Remembered quick-connect uses the same retained-ownership semantics.
          replace(
              'lib/src/controllers/connection_manager.dart',
              "    final attempt = _connectionAttempts.acquire(\n      machineId,\n      role: ConnectionAttemptRole.machine,\n      automatic: true,\n      controllerOwned: false,\n      ble: remembered.transportType == TransportType.ble,\n    );\n    if (attempt == null) return null;\n    try {\n      final device = await deviceScanner.tryQuickConnect(remembered);\n      if (device is De1Interface) {\n        if (!attempt.mayAdopt) {\n          await device.disconnect();\n          return null;\n        }\n        de1Controller.adoptDevice(device);\n        await _disconnectSupervisor.waitForMachine(device.deviceId);\n        if (!attempt.mayAdopt) {\n          await device.disconnect();\n          return null;\n        }\n        await _migrateQuickConnectAlias(remembered.id, device.deviceId);\n        _log.info('Quick-connect: machine adopted (${device.deviceId})');\n        return device;\n      }\n    } catch (e, st) {\n      _log.warning('Quick-connect: machine attempt failed', e, st);\n    } finally {\n      attempt.settle();\n    }\n    return null;\n  }\n\n  Future<void> _migrateQuickConnectAlias",
              "    final existing = _connectionAttempts.activeFor(machineId);\n    if (existing != null) {\n      if (existing.ble && existing.cleanupFailed) {\n        throw BleConnectException(\n          code: 'connectionFailed',\n          description:\n              'RECOVERY_BLOCKED: retained quick-connect ownership for $machineId',\n          function: 'connect',\n        );\n      }\n      return null;\n    }\n    final attempt = _connectionAttempts.acquire(\n      machineId,\n      role: ConnectionAttemptRole.machine,\n      automatic: true,\n      controllerOwned: false,\n      ble: remembered.transportType == TransportType.ble,\n    );\n    if (attempt == null) return null;\n    final adapterResetEpoch = _adapterResetEpoch;\n    try {\n      final device = await deviceScanner.tryQuickConnect(remembered);\n      if (device is De1Interface) {\n        if (!attempt.mayAdopt) {\n          await _cleanupQuickConnectMachine(\n            attempt,\n            device,\n            adapterResetEpoch: adapterResetEpoch,\n            expected: false,\n          );\n          return null;\n        }\n        de1Controller.adoptDevice(device);\n        await _disconnectSupervisor.waitForMachine(device.deviceId);\n        if (!attempt.mayAdopt) {\n          await _cleanupQuickConnectMachine(\n            attempt,\n            device,\n            adapterResetEpoch: adapterResetEpoch,\n            expected: true,\n          );\n          return null;\n        }\n        await _migrateQuickConnectAlias(remembered.id, device.deviceId);\n        _log.info('Quick-connect: machine adopted (${device.deviceId})');\n        return device;\n      }\n    } on BleConnectException catch (e, st) {\n      if (e.recoveryBlocked && attempt.ble) {\n        if (adapterResetEpoch != _adapterResetEpoch) {\n          _log.info(\n            'Quick-connect recovery block cleared by adapter reset for $machineId',\n          );\n          return null;\n        }\n        attempt.markCleanupFailed();\n        _log.warning('Quick-connect recovery blocked for $machineId', e, st);\n        rethrow;\n      }\n      _log.warning('Quick-connect: machine attempt failed', e, st);\n    } catch (e, st) {\n      _log.warning('Quick-connect: machine attempt failed', e, st);\n    } finally {\n      if (!attempt.cleanupFailed) attempt.settle();\n    }\n    return null;\n  }\n\n  Future<void> _cleanupQuickConnectMachine(\n    ConnectionAttemptLease attempt,\n    De1Interface device, {\n    required int adapterResetEpoch,\n    required bool expected,\n  }) async {\n    if (expected) markExpectingDisconnect(device.deviceId);\n    try {\n      await device.disconnect();\n    } catch (error, stackTrace) {\n      _log.warning(\n        'Quick-connect cleanup failed for ${device.deviceId}',\n        error,\n        stackTrace,\n      );\n      if (!attempt.ble || adapterResetEpoch != _adapterResetEpoch) return;\n      attempt.markCleanupFailed();\n      throw BleConnectException(\n        code: 'connectionFailed',\n        description:\n            'RECOVERY_BLOCKED: quick-connect cleanup failed for ${device.deviceId}',\n        function: 'disconnect',\n        cause: error,\n      );\n    }\n  }\n\n  Future<void> _migrateQuickConnectAlias",
          )

          # Surface the retained barrier and stop this automatic connect before scan fallback.
          replace(
              'lib/src/controllers/connection_manager.dart',
              "      final qcMachine = await _tryQuickConnectMachine();\n      if (qcMachine != null) {\n",
              "      De1Interface? qcMachine;\n      try {\n        qcMachine = await _tryQuickConnectMachine();\n      } on BleConnectException catch (error) {\n        if (!error.recoveryBlocked) rethrow;\n        final machineId = settingsController.preferredMachineId;\n        _publishStatus(\n          currentStatus.copyWith(\n            phase: ConnectionPhase.idle,\n            pendingAmbiguity: () => null,\n            activeTargetTransport: () => null,\n          ),\n        );\n        _emit(\n          ConnectionError(\n            kind: ConnectionErrorKind.machineConnectFailed,\n            severity: ConnectionErrorSeverity.error,\n            timestamp: DateTime.now().toUtc(),\n            deviceId: machineId,\n            message:\n                'Bluetooth recovery is blocked by unfinished connection cleanup.',\n            suggestion: 'Toggle Bluetooth off and on, then retry.',\n            details: {\n              if (error.code != null) 'ble_code': error.code,\n              if (error.description != null)\n                'ble_description': error.description,\n              if (error.function != null) 'ble_function': error.function,\n            },\n          ),\n        );\n        return;\n      }\n      if (qcMachine != null) {\n",
          )

          # Test scanner can inject a quick-connect error deterministically.
          replace(
              'test/helpers/mock_device_scanner.dart',
              "    quickConnectResult = null;\n    quickConnectCallCount = 0;\n",
              "    quickConnectResult = null;\n    quickConnectError = null;\n    quickConnectCallCount = 0;\n",
          )
          replace(
              'test/helpers/mock_device_scanner.dart',
              "  Device? quickConnectResult;\n\n  int quickConnectCallCount = 0;\n\n  @override\n  Future<Device?> tryQuickConnect(RememberedDevice remembered) async {\n    quickConnectCallCount++;\n    return quickConnectResult;\n  }\n",
              "  Device? quickConnectResult;\n  Object? quickConnectError;\n\n  int quickConnectCallCount = 0;\n\n  @override\n  Future<Device?> tryQuickConnect(RememberedDevice remembered) async {\n    quickConnectCallCount++;\n    final error = quickConnectError;\n    quickConnectError = null;\n    if (error != null) throw error;\n    return quickConnectResult;\n  }\n",
          )

          # Owner lookup regression.
          replace(
              'test/controllers/connection_attempt_owner_test.dart',
              "    test('repeated cancel is idempotent', () {\n",
              "    test('activeFor normalizes device ids', () {\n      final owner = ConnectionAttemptOwner();\n      final attempt = owner.acquire('AA:BB')!;\n\n      expect(owner.activeFor('aa:bb'), same(attempt));\n    });\n\n    test('repeated cancel is idempotent', () {\n",
          )

          # Service-level regression: RECOVERY_BLOCKED must not consume the one retry.
          replace(
              'test/services/universal_ble_discovery_service_test.dart',
              "import 'package:reaprime/src/models/device/remembered_device.dart';\n",
              "import 'package:reaprime/src/models/device/remembered_device.dart';\nimport 'package:reaprime/src/models/device/transport/ble_connect_exception.dart';\n",
          )
          service_anchor = "  group('quick-connect identity policy', () {\n"
          service_test = r'''  group('quick-connect identity policy', () {
    test('quick-connect does not retry recovery-blocked admission', () async {
      const deviceId = 'AA:BB:CC:DD:EE:21';
      var connectCalls = 0;
      final transport = _TrackingFakeBleTransport(
        deviceId: deviceId,
        onConnect: () async {
          connectCalls++;
          throw BleConnectException(
            code: 'connectionFailed',
            description: 'RECOVERY_BLOCKED: unresolved native GATT teardown',
            function: 'connect',
          );
        },
      );
      final sut = UniversalBleDiscoveryService(
        requiresSystemDevice: () => false,
        transportFactory:
            ({
              required device,
              required stopScan,
              required requestLargeMtuNonAndroid,
              required lifecycleGate,
            }) => transport,
      );
      addTearDown(sut.dispose);
      await sut.initialize();

      await expectLater(
        sut.tryQuickConnect(
          const RememberedDevice(
            id: deviceId,
            name: 'DE1',
            type: domain.DeviceType.machine,
            implementation: DeviceImplementation.unifiedDe1,
            transportType: TransportType.ble,
          ),
        ),
        throwsA(
          isA<BleConnectException>().having(
            (error) => error.recoveryBlocked,
            'recoveryBlocked',
            isTrue,
          ),
        ),
      );

      expect(connectCalls, 1);
      expect(transport.disconnectCalls, 0);
      expect(transport.disposeCalls, 1);
    });
'''
          replace('test/services/universal_ble_discovery_service_test.dart', service_anchor, service_test)

          # Manager-level regressions for retained recovery barriers and expected cleanup.
          manager_anchor = "      test('already-connected machine is not quick-connected again', () async {\n"
          manager_tests = r'''      test(
        'quick-connect recovery block retains ownership and skips scan fallback',
        () async {
          await connectionManager.dispose();
          await settingsController.setPreferredMachineId('blocked-de1');
          mockSettingsService.setRememberedDevices(
            RememberedDevice.encodeList([
              const RememberedDevice(
                id: 'blocked-de1',
                name: 'DE1',
                type: DeviceType.machine,
                implementation: DeviceImplementation.unifiedDe1,
                transportType: TransportType.ble,
              ),
            ]),
          );
          final remembered = RememberedDevicesController(
            machineConnections: const Stream.empty(),
            scaleConnections: const Stream.empty(),
            settings: mockSettingsService,
          );
          await remembered.initialize();
          mockScanner.quickConnectError = BleConnectException(
            code: 'connectionFailed',
            description: 'RECOVERY_BLOCKED: unresolved native GATT teardown',
            function: 'connect',
          );
          connectionManager = ConnectionManager(
            deviceScanner: mockScanner,
            de1Controller: mockDe1Controller,
            scaleController: mockScaleController,
            settingsController: settingsController,
            rememberedDevices: remembered,
          );

          await connectionManager.connect();

          expect(mockScanner.quickConnectCallCount, 1);
          expect(mockScanner.scanCallCount, 0);
          expect(
            connectionManager.currentStatus.error?.kind,
            ConnectionErrorKind.machineConnectFailed,
          );
          expect(
            connectionManager.currentStatus.error?.details?['ble_description'],
            contains('RECOVERY_BLOCKED:'),
          );

          await connectionManager.connect();
          expect(mockScanner.quickConnectCallCount, 1);
          expect(mockScanner.scanCallCount, 0);
          expect(
            (await connectionManager.connectMachine(
              _FakeDe1(
                deviceId: 'BLOCKED-DE1',
                transportType: TransportType.ble,
              ),
            )).outcome,
            ConnectionOutcome.conflict,
          );

          mockScanner.mockAdapterState(AdapterState.poweredOff);
          await Future<void>.delayed(Duration.zero);
          expect(
            (await connectionManager.connectMachine(
              _FakeDe1(
                deviceId: 'blocked-de1',
                transportType: TransportType.ble,
              ),
            )).outcome,
            ConnectionOutcome.connected,
          );
          await remembered.dispose();
        },
      );

      test('cancelled adopted quick-connect marks cleanup as expected', () async {
        await connectionManager.dispose();
        await settingsController.setPreferredMachineId('pref-de1');
        mockSettingsService.setRememberedDevices(
          RememberedDevice.encodeList([
            const RememberedDevice(
              id: 'pref-de1',
              name: 'DE1',
              type: DeviceType.machine,
              implementation: DeviceImplementation.unifiedDe1,
              transportType: TransportType.ble,
            ),
          ]),
        );
        final remembered = RememberedDevicesController(
          machineConnections: const Stream.empty(),
          scaleConnections: const Stream.empty(),
          settings: mockSettingsService,
        );
        await remembered.initialize();
        final disconnectStarted = Completer<void>();
        final device = _FakeDe1(
          deviceId: 'pref-de1',
          transportType: TransportType.ble,
          disconnectStarted: disconnectStarted,
        );
        mockScanner.quickConnectResult = device;
        connectionManager = ConnectionManager(
          deviceScanner: mockScanner,
          de1Controller: mockDe1Controller,
          scaleController: mockScaleController,
          settingsController: settingsController,
          rememberedDevices: remembered,
        );

        final connecting = connectionManager.connect();
        await Future<void>.delayed(Duration.zero);
        mockScanner.mockAdapterState(AdapterState.unauthorized);
        await Future<void>.delayed(Duration.zero);
        mockDe1Controller.de1Subject.add(device);
        await disconnectStarted.future;
        await connecting;

        expect(
          connectionManager.currentStatus.error?.kind,
          ConnectionErrorKind.bluetoothPermissionDenied,
        );
        connectionManager.debugNotifyMachineDisconnected(device.deviceId);
        expect(
          connectionManager.currentStatus.error?.kind,
          ConnectionErrorKind.bluetoothPermissionDenied,
        );
        await remembered.dispose();
      });

      test('already-connected machine is not quick-connected again', () async {
'''
          replace('test/controllers/connection_manager_test.dart', manager_anchor, manager_tests)

          # Direct controller path uses the same RECOVERY_BLOCKED retention rule.
          direct_anchor = "      test('adapter reset releases a failed BLE cleanup lease', () async {\n"
          direct_test = r'''      test('recovery-blocked BLE source retains its lease until adapter reset', () async {
        mockDe1Controller.failNextConnectWith = BleConnectException(
          code: 'connectionFailed',
          description: 'RECOVERY_BLOCKED: unresolved native GATT teardown',
          function: 'connect',
        );
        final machine = _FakeDe1(
          deviceId: 'blocked-source-machine',
          transportType: TransportType.ble,
        );

        expect(
          (await connectionManager.connectMachine(machine)).outcome,
          ConnectionOutcome.failed,
        );
        expect(
          (await connectionManager.connectMachine(
            _FakeDe1(
              deviceId: 'BLOCKED-SOURCE-MACHINE',
              transportType: TransportType.ble,
            ),
          )).outcome,
          ConnectionOutcome.conflict,
        );

        mockScanner.mockAdapterState(AdapterState.poweredOff);
        await Future<void>.delayed(Duration.zero);

        expect(
          (await connectionManager.connectMachine(
            _FakeDe1(
              deviceId: 'blocked-source-machine',
              transportType: TransportType.ble,
            ),
          )).outcome,
          ConnectionOutcome.connected,
        );
      });

      test('adapter reset releases a failed BLE cleanup lease', () async {
'''
          replace('test/controllers/connection_manager_test.dart', direct_anchor, direct_test)

          # Align archived contract with the simplified idempotent-cancellation model.
          replace(
              'doc/plans/archive/871-ble-recovery/part-4-decaid-integration.md',
              '- repeated cancellation is idempotent and preserves the first owner/reason;\n',
              '- repeated cancellation is idempotent;\n',
          )
          PY

      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/models/device/transport/ble_connect_exception.dart \
            lib/src/controllers/connection/connection_attempt_owner.dart \
            lib/src/services/universal_ble_discovery_service.dart \
            lib/src/controllers/connection_manager.dart \
            test/helpers/mock_device_scanner.dart \
            test/controllers/connection_attempt_owner_test.dart \
            test/services/universal_ble_discovery_service_test.dart \
            test/controllers/connection_manager_test.dart
      - name: Run focused tests
        run: |
          flutter test --no-pub \
            test/controllers/connection_attempt_owner_test.dart \
            test/services/universal_ble_discovery_service_test.dart \
            test/controllers/connection_manager_test.dart
      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/_temporary_881_review_fixes.yml
          git config user.name ODevStudio
          git config user.email ODevStudio@proton.me
          git add -A
          git diff --cached --check
          git commit -m 'fix(ble): retain recovery-blocked connection ownership'
          git push origin HEAD:fix/876-ble-recovery-integration
