name: Temporary Dart formatter diff

on:
  push:
    branches:
      - diagnostics/875-ble-recovery-baseline

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Print exact formatter diff
        shell: bash
        run: |
          dart format test/ble_diagnostics_handler_test.dart
          git diff -- test/ble_diagnostics_handler_test.dart
          test -z "$(git status --porcelain -- test/ble_diagnostics_handler_test.dart)"
